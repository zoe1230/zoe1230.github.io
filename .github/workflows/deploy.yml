# Deploy VitePress site to GitHub Pages
name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout generative-foundations tutorial
        uses: actions/checkout@v5
        with:
          repository: zoe1230/tutorial-generative-foundations
          path: generative-foundations
          fetch-depth: 0

      - name: Checkout fine-detail-depth tutorial
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: zoe1230/tutorial-fine-detail-depth
          path: fine-detail-depth
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache VitePress
        uses: actions/cache@v4
        with:
          path: .vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('**/*.md', 'package-lock.json', '.vitepress/config.ts') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
